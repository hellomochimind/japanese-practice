<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Japanese Ages 0-10</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,sans-serif;background:#f0f7ff;color:#2b2d42;display:flex;flex-direction:column;align-items:center;padding:16px}
.tabs{display:flex;gap:8px;background:#dcebfa;padding:5px;border-radius:99px;width:100%;max-width:420px;margin-bottom:12px}
.tab{flex:1;border:none;padding:10px;border-radius:99px;font-weight:700;background:transparent;cursor:pointer}.tab.on{background:#ff6b6b;color:#fff}
.box{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}.hide{display:none}
.scene{width:100%;height:390px;perspective:1000px;margin-bottom:14px;cursor:pointer}
.card{width:100%;height:100%;position:relative;transition:transform .5s;transform-style:preserve-3d}.card.flip{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:24px;box-shadow:0 8px 20px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px}
.back{transform:rotateY(180deg);background:#fff9eb;justify-content:center;gap:10px;text-align:center}
.pic{width:100%;height:250px;border-radius:16px;overflow:hidden}.pic svg{width:100%;height:100%}
.row{display:flex;gap:10px;width:100%}.btn{border:none;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;flex:1;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.08)}.say{background:#4ecdc4;color:#fff;flex:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.opt{background:#fff;border:4px solid transparent;border-radius:16px;padding:8px;text-align:center;cursor:pointer}.opt svg{width:100%;height:115px}.ok{border-color:#2ec4b6;background:#e6fcf9}.no{border-color:#ff6b6b;background:#fff0f0}
</style></head><body>
<h2 style="margin:0 0 10px">🎂 Japanese Ages (0–10)</h2>
<div class="tabs"><button class="tab on" id="t1">Study Cards</button><button class="tab" id="t2">Listening Quiz</button></div>
<div class="box" id="v1"><div class="scene" id="sc"><div class="card" id="cd"><div class="face"><div class="pic" id="svg"></div><div id="en" style="font-size:1.8rem;font-weight:800;color:#ff6b6b"></div><div id="ms" style="color:#6c757d;font-weight:600"></div></div><div class="face back"><div id="ir"></div><div id="kj" style="font-size:3rem;font-weight:800"></div><div id="kn" style="font-size:2rem;font-weight:700;color:#ff6b6b"></div><div id="rm" style="font-size:1.4rem;font-weight:700;color:#4ecdc4"></div></div></div></div>
<div class="row"><button class="btn" id="pv">◀ Prev</button><button class="btn say" id="sp">🔊 Listen</button><button class="btn" id="nx">Next ▶</button></div><p id="st" style="font-weight:700"></p></div>
<div class="box hide" id="v2"><button class="btn say" style="width:100%;margin-bottom:12px" id="rp">🔊 Play Sound Again</button><div class="grid" id="gd"></div><p id="qs" style="font-weight:700"></p></div>
<script>
const D=[[0,"0 Years Old","Newborn Baby","0歳","ぜろさい","zerosai",0,"#ffe5ec","👶🍼"],[1,"1 Year Old","First Steps","1歳","いっさい","issai",1,"#ffcad4","🚼🧸"],[2,"2 Years Old","Toddler Play","2歳","にさい","nisai",0,"#fde4cf","🛴🐥"],[3,"3 Years Old","Preschool Blocks","3歳","さんさい","sansai",0,"#fbf8cc","🧱🎨"],[4,"4 Years Old","Little Artist","4歳","よんさい","yonsai",0,"#b9fbc0","🖌️🖍️"],[5,"5 Years Old","Kindergartener","5歳","ごさい","gosai",0,"#98f5e1","🎒🌈"],[6,"6 Years Old","1st Grade School","6歳","ろくさい","rokusai",0,"#8eecf5","🏫✏️"],[7,"7 Years Old","Riding a Bike","7歳","ななさい","nanasai",0,"#90dbf4","🚲⭐"],[8,"8 Years Old","Playing Football","8歳","はっさい","hassai",1,"#a3c4f3","⚽🏅"],[9,"9 Years Old","Reading Books","9歳","きゅうさい","kyuusai",0,"#cfbaf0","📚🎸"],[10,"10 Years Old","Double Digits!","10歳","じゅっさい","jussai",1,"#f1c0e8","🎂🔟"]];
function pic(d){const a=d[0],p=a===0?`<ellipse cx="200" cy="145" rx="65" ry="35" fill="#fff"/><circle cx="155" cy="138" r="22" fill="#ffe0bd"/>`:`<circle cx="185" cy="75" r="22" fill="#ffe0bd"/><path d="M163 71 Q185 45 207 71" fill="#3d2314"/><circle cx="178" cy="75" r="3"/><circle cx="192" cy="75" r="3"/><rect x="165" y="99" width="40" height="${42+a*2}" rx="10" fill="#ff6b6b"/><rect x="169" y="${141+a*2}" width="13" height="${32+a*2}" rx="5" fill="#2b2d42"/><rect x="188" y="${141+a*2}" width="13" height="${32+a*2}" rx="5" fill="#2b2d42"/>`;return `<svg viewBox="0 0 400 260" xmlns="http://w3.org"><rect width="400" height="260" rx="18" fill="${d[7]}"/>${p}<text x="275" y="140" font-size="52" text-anchor="middle">${d[8]}</text><text x="200" y="242" font-size="22" font-weight="bold" text-anchor="middle">${d[0]} • ${d[2]}</text></svg>`}
let i=0,seen=new Set(),tg=null,sc=0;
function show(){const d=D[i];cd.classList.remove("flip");svg.innerHTML=pic(d);en.textContent=d[1];ms.textContent=d[2]+" • Tap to flip";kj.textContent=d[3];kn.textContent=d[4];rm.textContent=d[5];ir.innerHTML=d[6]?'<span style="background:#ff6b6b;color:#fff;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700">SPECIAL SOUND</span>':"";st.textContent=`Card ${i+1} of 11`;seen.add(i);if(seen.size===11){chime();st.textContent="🎉 All 11 ages viewed!"}}
function say(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.pitch=1.9;u.rate=.95;const v=speechSynthesis.getVoices().filter(x=>x.lang.includes("ja"));const f=v.find(x=>/kyoko|haruka|nanami|ayumi|o-ren|female|google/i.test(x.name))||v[0];if(f)u.voice=f;speechSynthesis.speak(u)}
function chime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784,1046].forEach((f,k)=>{const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.18,c.currentTime+k*.12);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+k*.12+.3);o.connect(g);g.connect(c.destination);o.start(c.currentTime+k*.12);o.stop(c.currentTime+k*.12+.3)})}catch(e){}}
function quiz(){const o=[...D].sort(()=>Math.random()-.5).slice(0,4);tg=o[Math.floor(Math.random()*4)];gd.innerHTML="";o.forEach(d=>{const b=document.createElement("div");b.className="opt";b.innerHTML=pic(d)+`<b>${d[1]}</b>`;b.onclick=()=>{if(d[0]===tg[0]){b.classList.add("ok");sc++;chime();qs.textContent=`⭐ Great! (${d[4]}) • Score: ${sc}`;setTimeout(quiz,1300)}else{b.classList.add("no");qs.textContent=`Try again! • Score: ${sc}`;say(tg[4])}};gd.appendChild(b)});setTimeout(()=>say(tg[4]),250)}
if("speechSynthesis"in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
sc.onclick=()=>{cd.classList.toggle("flip");if(cd.classList.contains("flip"))say(D[i][4])};
pv.onclick=()=>{i=(i+10)%11;show()};nx.onclick=()=>{i=(i+1)%11;show()};sp.onclick=()=>say(D[i][4]);rp.onclick=()=>tg&&say(tg[4]);
t1.onclick=()=>{t1.classList.add("on");t2.classList.remove("on");v1.classList.remove("hide");v2.classList.add("hide")};
t2.onclick=()=>{t2.classList.add("on");t1.classList.remove("on");v2.classList.remove("hide");v1.classList.add("hide");quiz()};
show();
</script></body></html>
